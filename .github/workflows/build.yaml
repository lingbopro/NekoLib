name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-fabric:
        description: 'URL to fabric build artifact'
        value: ${{ jobs.build.outputs.artifact-fabric }}
      artifact-neoforge:
        description: 'URL to neoforge build artifact'
        value: ${{ jobs.build.outputs.artifact-neoforge }}

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-fabric: ${{ steps.upload-fabric.outputs.artifact-url }}
      artifact-neoforge: ${{ steps.upload-neoforge.outputs.artifact-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Upload fabric build results
        id: upload-fabric
        uses: actions/upload-artifact@v7
        with:
          name: build-fabric
          path: fabric/build/libs/
      - name: Upload neoforge build results
        id: upload-neoforge
        uses: actions/upload-artifact@v7
        with:
          name: build-neoforge
          path: neoforge/build/libs/
